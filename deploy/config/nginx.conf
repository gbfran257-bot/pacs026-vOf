worker_processes auto;
error_log /var/logs/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  resolver 127.0.0.11 valid=30s;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
  '$status $body_bytes_sent "$http_referer" '
  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/logs/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  gzip on;
  gzip_disable "msie6";
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  server {
    listen 81 default_server;
    listen [::]:81 default_server;
    server_name _;

    client_max_body_size 0;

    # --- dcm4chee-arc UI en /pacs ---
    location /pacs {
      rewrite ^/pacs(.*)$ /dcm4chee-arc/ui2$1 break;
      proxy_pass http://arc:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_request_buffering off;
      expires 0;
      add_header Cache-Control private;
    }

    # --- Verificación de permiso de escritura (consulta a share-api) ---
    location = /_auth/write {
      internal;
      proxy_pass http://share-api:4000/api/portal-auth/can-write;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Original-Referer $http_referer;
    }

    # --- Escrituras al PACS: solo pasan si can-write responde 2xx ---
    location /_write/ {
      internal;
      auth_request /_auth/write;
      rewrite ^/_write(.*)$ $1 break;
      proxy_pass http://arc:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_request_buffering off;
    }

    # --- DICOMweb (rs): lecturas libres, el resto se desvía a /_write ---
    location ~ ^/dcm4chee-arc/aets/[^/]+/rs/ {
      if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        rewrite ^(.*)$ /_write$1 last;
      }
      proxy_pass http://arc:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_request_buffering off;
    }

    # --- Resto de dcm4chee-arc ---
    location /dcm4chee-arc/ {
      proxy_pass http://arc:8080/dcm4chee-arc/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_request_buffering off;
    }

    location /sw.js {
      add_header Cache-Control "no-cache";
      proxy_cache_bypass $http_pragma;
      proxy_cache_revalidate on;
      expires off;
      access_log off;
    }

    # --- share-api (conserva el prefijo /api; timeouts largos para subir carpetas) ---
    location /api/ {
      proxy_pass http://share-api:4000/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }

    # --- OHIF ---
    location /viewer {
      root /var/www/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }

    # --- Portal de usuarios ---
    location = /viewers {
      return 301 /viewers/;
    }

    location /viewers/ {
      alias /var/www/portal/;
      index index.html;
      try_files $uri $uri/ /viewers/index.html;
    }

    # --- Lista de estudios (raíz) protegida con Basic Auth ---
    location = / {
      auth_basic "Clinica San Antonio - Acceso restringido";
      auth_basic_user_file /etc/nginx/.htpasswd;
      root /var/www/html;
      index index.html;
      try_files /index.html =404;
      add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
      root /var/www/html;
      index index.html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
  }
}
